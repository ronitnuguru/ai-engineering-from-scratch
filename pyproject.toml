[project]
name = "ai-engineering-from-scratch"
version = "0.1.0"
description = "260+ lessons covering AI/ML from math foundations to production systems"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

# Core dependencies (Phases 0-3)
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Phase 3-10: Deep Learning
torch = [
    "torch>=2.3",
    "torchvision>=0.18",
    "torchaudio>=2.3",
]

# Phase 4-5: Computer Vision & NLP
cv-nlp = [
    "pillow>=10.0",
    "opencv-python>=4.8",
    "nltk>=3.8",
    "spacy>=3.7",
]

# Phase 7-10: Transformers & LLMs
transformers = [
    "transformers>=4.40",
    "datasets>=2.18",
    "tokenizers>=0.19",
    "sentencepiece>=0.2.0",
]

# Phase 11-16: LLM APIs & Agents
llm = [
    "anthropic>=0.39",
    "openai>=1.50",
]

# Phase 13-16: Tools & Agent Engineering
tools = [
    "requests>=2.31",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

# Development tools
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.9",
]

# All dependencies (for testing)
all = [
    "ai-engineering-from-scratch[torch,cv-nlp,transformers,llm,tools,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
